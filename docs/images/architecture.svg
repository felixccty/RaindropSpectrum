<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>系统架构</title>
  <desc>RaindropSpectrum 分为界面层、业务层与数据层，采集卡数据自下而上流动。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">系统架构</text>
  <rect x="40" y="56" width="600" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="48" y="94.0" font-size="12" fill="#185FA5" dominant-baseline="central">界面层</text>
  <rect x="152" y="72" width="108" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="206" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">实时信号波形</text>
  <rect x="272" y="72" width="108" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="326" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨滴谱热图</text>
  <rect x="393" y="72" width="108" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="447" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨量柱状图</text>
  <rect x="514" y="72" width="108" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="568" y="94.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">状态与阈值</text>
  <line x1="340.0" y1="132" x2="340.0" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="148" width="600" height="76" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="48" y="186.0" font-size="12" fill="#0F6E56" dominant-baseline="central">业务层</text>
  <rect x="190" y="164" width="180" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="280" y="186.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">raindrop_spectrum 主窗口</text>
  <rect x="393" y="164" width="180" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="483" y="186.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">timer1 / timer_ra 定时器</text>
  <line x1="340.0" y1="224" x2="340.0" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="240" width="600" height="76" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="48" y="278.0" font-size="12" fill="#534AB7" dominant-baseline="central">数据层</text>
  <rect x="152" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="226" y="278.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">inBuffer 采集缓冲</text>
  <rect x="313" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="387" y="278.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Rain_record.csv</text>
  <rect x="473" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="548" y="278.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">USB9825 SDK</text>
</svg>
