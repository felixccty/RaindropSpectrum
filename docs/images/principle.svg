<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>幅度—速度分布原理</title>
  <desc>雨滴识别结果分别映射到雨滴谱热图的横轴与纵轴，并按分钟聚合为雨量柱状图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">幅度—速度分布原理</text>
  <rect x="40" y="56" width="170" height="62" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="125" y="87.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">采集信号 inBuffer</text>
  <line x1="210" y1="87.0" x2="258" y2="87.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="56" width="156" height="62" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="87.0" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">阈值穿越检测 timeSlot</text>
  <line x1="418" y1="87.0" x2="466" y2="87.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="56" width="170" height="62" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="555" y="87.0" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨滴事件(幅度,时长)</text>
  <rect x="40" y="140" width="170" height="62" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="125" y="171.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">最低幅度 lowest_v</text>
  <line x1="210" y1="171.0" x2="258" y2="171.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="140" width="156" height="62" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="340" y="171.0" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">横轴映射 2000-2400</text>
  <line x1="418" y1="171.0" x2="466" y2="171.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="140" width="170" height="62" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="555" y="171.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨滴谱热图（X）</text>
  <rect x="40" y="224" width="170" height="62" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="125" y="255.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">持续时长 duration</text>
  <line x1="210" y1="255.0" x2="258" y2="255.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="224" width="156" height="62" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="340" y="255.0" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">纵轴映射 0-200</text>
  <line x1="418" y1="255.0" x2="466" y2="255.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="224" width="170" height="62" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="555" y="255.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨滴谱热图（Y）</text>
  <rect x="40" y="308" width="170" height="62" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="125" y="339.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">rain_counter 计数</text>
  <line x1="210" y1="339.0" x2="258" y2="339.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="262" y="308" width="156" height="62" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="339.0" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">timeSlot_ra 按分钟聚合</text>
  <line x1="418" y1="339.0" x2="466" y2="339.0" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="308" width="170" height="62" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="555" y="339.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">雨量柱状图</text>
  <text x="40" y="400" font-size="11" fill="#5F5E5A">热图网格以 (lowest_v-2000, duration) 累加计数；颜色由 #f6efa6 渐变到 #bf444c 表示计数高低。</text>
</svg>
